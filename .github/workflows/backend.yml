name: backend

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

jobs:
  build:
    name: Backend build (warnaserror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('NomiWrite.Backend/**/*.csproj', 'NomiWrite.Backend/**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NomiWrite.Backend/NomiWrite.sln --nologo

      - name: Build (treat warnings as errors)
        run: dotnet build NomiWrite.Backend/NomiWrite.sln --no-restore -warnaserror --nologo

  unit:
    name: Backend unit tests + coverage gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('NomiWrite.Backend/**/*.csproj', 'NomiWrite.Backend/**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install reportgenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Restore
        run: dotnet restore NomiWrite.Backend/NomiWrite.sln --nologo

      - name: Run unit tests with coverage
        working-directory: NomiWrite.Backend
        run: |
          set -euo pipefail
          rm -rf artifacts/coverage-raw
          for proj in tests/NomiWrite.*.UnitTests; do
            name="$(basename "$proj")"
            dotnet test "$proj" --no-restore --nologo \
              --collect:"XPlat Code Coverage" \
              --results-directory "artifacts/coverage-raw/$name"
          done

      - name: Merge coverage reports
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:NomiWrite.Backend/artifacts/coverage-raw/**/*.cobertura.xml \
            -targetdir:NomiWrite.Backend/artifacts/coverage-merged -reporttypes:Cobertura

      - name: Enforce coverage baselines
        run: |
          python3 NomiWrite.Backend/tests/coverage-gate.py \
            NomiWrite.Backend/artifacts/coverage-merged/Cobertura.xml \
            NomiWrite.Backend/tests/coverage-baseline.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: NomiWrite.Backend/artifacts/coverage-merged